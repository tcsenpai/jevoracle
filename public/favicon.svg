<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="core" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#BFF6FD"/>
      <stop offset="55%" stop-color="#4FD8E8"/>
      <stop offset="100%" stop-color="#4FD8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FD8E8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4FD8E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05080E"/>

  <!-- projector cone -->
  <path d="M32 20 L52 50 L12 50 Z" fill="url(#beam)"/>

  <!-- emitter base -->
  <ellipse cx="32" cy="50" rx="19" ry="4.2" fill="none" stroke="#4FD8E8" stroke-width="2" opacity=".85"/>
  <ellipse cx="32" cy="50" rx="11" ry="2.4" fill="none" stroke="#4FD8E8" stroke-width="1.4" opacity=".5"/>

  <!-- the droid head: octahedron cage -->
  <g stroke="#4FD8E8" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <path d="M32 9 L45 24 L32 39 L19 24 Z"/>
    <path d="M19 24 L45 24"/>
  </g>

  <!-- glowing core -->
  <circle cx="32" cy="24" r="9" fill="url(#core)"/>
  <circle cx="32" cy="24" r="3.4" fill="#EAFDFF"/>
</svg>
